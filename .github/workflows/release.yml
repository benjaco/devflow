name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify tag (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            binary: devflow
          - os: macos-15
            arch: arm64
            binary: devflow
          - os: windows-latest
            arch: amd64
            binary: devflow.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Delve
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.27.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify native architecture
        shell: bash
        run: |
          actual="$(go env GOHOSTARCH)"
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "expected ${{ matrix.arch }}, got $actual"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build devflow
        run: go build -trimpath -v -o "${{ runner.temp }}/${{ matrix.binary }}" ./cmd/devflow
