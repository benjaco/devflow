name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install Delve
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.26.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: go test ./...

      - name: Build devflow
        run: go build -v -o "${{ runner.temp }}/devflow" ./cmd/devflow
