name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build devflow
        run: go build -v -o "${{ runner.temp }}/devflow" ./cmd/devflow
