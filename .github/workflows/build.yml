name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test-and-build:
    name: test and build (${{ matrix.os }}/${{ matrix.arch }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26.6"
            arch: amd64
            binary: devflow
          - os: macos-15
            go: "1.26.6"
            arch: arm64
            binary: devflow
          - os: windows-latest
            go: "1.26.6"
            arch: amd64
            binary: devflow.exe
          - os: ubuntu-latest
            go: stable
            arch: amd64
            binary: devflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Delve
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.26.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify native architecture
        shell: bash
        run: |
          actual="$(go env GOHOSTARCH)"
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "expected ${{ matrix.arch }}, got $actual"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build devflow
        run: go build -trimpath -v -o "${{ runner.temp }}/${{ matrix.binary }}" ./cmd/devflow

  race:
    name: race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Run race detector
        run: go test -race -count=1 ./...

  database-docker:
    name: database Docker e2e (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native architecture
        shell: bash
        run: |
          actual="$(go env GOHOSTARCH)"
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "expected ${{ matrix.arch }}, got $actual"
            exit 1
          fi

      - name: Install PostgreSQL clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run database Docker integration tests
        env:
          DEVFLOW_E2E_DOCKER: "1"
        run: go test -count=1 -timeout=40m ./pkg/database -run 'TestDocker(EngineArchitectureMatchesHost|RuntimeServiceLifecycle|PostgresDumpSourcePolicyClonesSchemaAndDataFromNonDefaultPort|PostGISRuntimeSpatialQuery)E2E' -v
